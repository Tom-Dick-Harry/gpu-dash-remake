[package]
name = "sysinfo_server"
version = "0.1.0"
authors = ["Suvan GS <suvan.gowrishanker.204@gmail.com>"]
description = "A simple tool to get realtime system information"
repository = "https://github.com/Tom-Dick-Harry/gpu-dash-remake"
edition = "2021"
include = [
    "/src/**/*.rs",
    "*.c",
    "*.lib",
    "*.dll",
]

[[bin]]
name = "gui"
path = "src/gui.rs"

[dependencies]
iced = { version = "0.12", features = ["canvas", "tokio"] }
iced_widget = { version = "0.13", features = ["canvas"] }
iced_graphics = "0.13"
plotters-iced = "0.11.0"
plotters = { version = "0.3", default-features = false, features = [
    "chrono",
    "area_series",
    "line_series",
    "point_series",
] }
plotters-backend = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12.0"
reqwest = { version = "0.11", features = ["json", "blocking"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sysinfo = "0.30"
chrono = "0.4"
once_cell = "1"
